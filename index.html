<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>WADAH4D — Tournament Leaderboard</title>
    <meta name="description" content="Portal turnamen game dengan klasemen peserta, informasi hadiah, dan peraturan kompetisi.">
    <meta name="theme-color" content="#0b1020">

    <link rel="icon" href="data:,">

    <style>
        :root {
            color-scheme: dark;
            --bg: #080c16;
            --surface: #101827;
            --surface-2: #151f31;
            --border: rgba(148, 163, 184, .15);
            --text: #f1f5f9;
            --muted: #94a3b8;
            --accent: #5eead4;
            --accent-dark: #0f766e;
            --gold: #fbbf24;
            --radius: 18px;
            --container: 1160px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background:
                radial-gradient(ellipse at 15% 0%, rgba(20, 184, 166, .09), transparent 35%),
                radial-gradient(ellipse at 95% 20%, rgba(99, 102, 241, .08), transparent 30%),
                var(--bg);
            color: var(--text);
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", sans-serif;
            font-size: 14px;
            line-height: 1.7;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input {
            font: inherit;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        img {
            max-width: 100%;
        }

        .container {
            width: min(var(--container), calc(100% - 40px));
            margin-inline: auto;
        }

        /* HEADER */

        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(8, 12, 22, .88);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(18px);
        }

        .navbar {
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand-logo {
            width: 43px;
            height: 43px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            background: linear-gradient(135deg, #5eead4, #14b8a6);
            color: #042f2e;
            font-size: 20px;
            font-weight: 900;
            box-shadow: 0 6px 24px rgba(20, 184, 166, .16);
        }

        .brand-name {
            margin: 0;
            font-size: 17px;
            line-height: 1.3;
            font-weight: 850;
            letter-spacing: .5px;
        }

        .brand-caption {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 26px;
        }

        .nav-links a {
            color: #cbd5e1;
            font-size: 13px;
            transition: color .2s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .header-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 17px;
            border-radius: 10px;
            background: var(--accent);
            color: #042f2e;
            font-weight: 800;
            font-size: 12px;
            transition: transform .2s, filter .2s;
        }

        .header-action:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        /* HERO */

        .hero {
            padding-top: 34px;
        }

        .hero-banner {
            position: relative;
            overflow: hidden;
            min-height: 290px;
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 24px;
            background:
                radial-gradient(ellipse at 85% 30%, rgba(94, 234, 212, .16), transparent 40%),
                linear-gradient(120deg, #111c2e, #101827 60%, #102c32);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 650px;
            padding: 42px 48px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 11px;
            border: 1px solid rgba(94, 234, 212, .25);
            border-radius: 999px;
            background: rgba(94, 234, 212, .07);
            color: var(--accent);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 12px rgba(94, 234, 212, .7);
        }

        .hero h2 {
            margin: 20px 0 12px;
            font-size: clamp(30px, 5vw, 49px);
            line-height: 1.13;
            letter-spacing: -1.8px;
            font-weight: 900;
        }

        .hero h2 span {
            color: var(--accent);
        }

        .hero-description {
            max-width: 490px;
            margin: 0;
            color: #a9b8ca;
            font-size: 14px;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 26px;
        }

        .button {
            min-height: 43px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 17px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface-2);
            color: var(--text);
            font-size: 12px;
            font-weight: 750;
            cursor: pointer;
            transition: .2s ease;
        }

        .button:hover {
            border-color: rgba(94, 234, 212, .5);
            transform: translateY(-1px);
        }

        .button-primary {
            background: var(--accent);
            color: #042f2e;
            border-color: transparent;
        }

        .hero-decoration {
            position: absolute;
            right: 7%;
            top: 50%;
            width: 220px;
            height: 220px;
            display: grid;
            place-items: center;
            transform: translateY(-50%);
            border: 1px solid rgba(94, 234, 212, .13);
            border-radius: 50%;
            background: rgba(94, 234, 212, .025);
        }

        .hero-decoration::before,
        .hero-decoration::after {
            content: "";
            position: absolute;
            border: 1px solid rgba(94, 234, 212, .14);
            border-radius: 50%;
        }

        .hero-decoration::before {
            inset: 22px;
        }

        .hero-decoration::after {
            inset: 44px;
        }

        .hero-symbol {
            font-size: 76px;
            font-weight: 900;
            color: rgba(94, 234, 212, .85);
            text-shadow: 0 0 40px rgba(94, 234, 212, .2);
        }

        /* GENERAL SECTIONS */

        .section {
            padding-top: 34px;
        }

        .section-heading {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 18px;
        }

        .section-kicker {
            margin: 0 0 5px;
            color: var(--accent);
            font-size: 10px;
            font-weight: 850;
            letter-spacing: 1.8px;
            text-transform: uppercase;
        }

        .section-title {
            margin: 0;
            font-size: 23px;
            font-weight: 850;
            letter-spacing: -.6px;
            line-height: 1.35;
        }

        .section-description {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 12px;
        }

        .panel {
            min-width: 0;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: rgba(16, 24, 39, .88);
        }

        /* STATS */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 15px;
        }

        .stat-card {
            padding: 19px 21px;
        }

        .stat-label {
            color: var(--muted);
            font-size: 11px;
        }

        .stat-value {
            display: block;
            margin-top: 5px;
            font-size: 24px;
            font-weight: 850;
            letter-spacing: -.5px;
        }

        .stat-note {
            color: var(--accent);
            font-size: 10px;
        }

        /* MAIN GRID */

        .main-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.8fr) minmax(280px, .9fr);
            align-items: start;
            gap: 20px;
        }

        .leaderboard {
            overflow: hidden;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            padding: 20px 22px;
            border-bottom: 1px solid var(--border);
        }

        .panel-title {
            margin: 0;
            font-size: 16px;
            font-weight: 800;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 5px 9px;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
            font-size: 10px;
        }

        .search-form {
            display: flex;
            gap: 9px;
            padding: 17px 22px;
        }

        .search-input {
            width: 100%;
            min-width: 0;
            height: 42px;
            padding: 0 13px;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            background: #0b1220;
            color: var(--text);
            font-size: 12px;
            transition: border-color .2s;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        .table-wrap {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
            text-align: left;
        }

        thead {
            background: rgba(255, 255, 255, .018);
        }

        th {
            padding: 12px 19px;
            color: var(--muted);
            font-size: 10px;
            font-weight: 750;
            letter-spacing: .7px;
            text-transform: uppercase;
        }

        td {
            padding: 15px 19px;
            border-top: 1px solid rgba(148, 163, 184, .09);
            font-size: 12px;
        }

        tbody tr {
            transition: background .2s;
        }

        tbody tr:hover {
            background: rgba(94, 234, 212, .035);
        }
